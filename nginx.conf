server {
    listen 80;
    server_name fixly.fillipsoftware.com;

    # Path where your built frontend (dist/) lives on the server
    root /var/www/fixly/dist;
    index index.html;

    # Static assets — long cache, exact match only
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all paths serve index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }
}
